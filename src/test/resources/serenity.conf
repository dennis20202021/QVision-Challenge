webdriver {
  driver = chrome
  autodownload = true
}
headless.mode = false

serenity {
  take.screenshots = FOR_EACH_ACTION
}
#
# Chrome options can be defined using the chrome.switches property
#
chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                   --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                   --disable-infobars,--disable-gpu"""

environments {
  default {
    webdriver.base.url = "https://portalaforepru.suramexico.com/PortalAccesoWeb/login.jsp"
  }
  dev {
    webdriver.base.url = "https://portalaforedes.suramexico.com/PortalAccesoWeb/login.jsp"
  }
  test {
    webdriver.base.url = "https://portalaforepru.suramexico.com/PortalAccesoWeb/login.jsp"
  }
  prod {
    webdriver.base.url = "https://portalafore.suramexico.com/PortalAccesoWeb/login.jsp"
  }
}